name: CI

on:
  pull_request:
  push:
    branches: [main]

# This workflow builds and tests; it writes nothing. Declared explicitly because
# the repository default for GITHUB_TOKEN is `write`, and a workflow with no
# permissions block silently inherits it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.95.0 with rustfmt and clippy, and rustup
      # honours it. Nothing here picks a channel, so the file stays the one
      # place the toolchain is decided.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          # The SDK is a git dependency pinned by rev, so the checkout is worth
          # caching across runs — it dominates a cold build.
          cache-on-failure: true

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      # The network and funded-key tests are #[ignore]d and stay that way here:
      # they spend real VRSCTEST and talk to a public node this project does not
      # pay for. CI covers the offline suite only, which is the whole of what
      # can be asserted without a wallet.
      - name: Tests
        run: cargo test --all-features

      - name: Build
        run: cargo build --release

      # The site is generated from docs/*.md, so a documentation change can
      # break it while every Rust check stays green. That is not hypothetical:
      # a cross-reference written the way GitHub wants it failed two deploys on
      # main before anyone looked, because the deploy workflow only runs after
      # a merge and nobody was watching it. Building here means a PR that would
      # break the site cannot be green.
      #
      # build.py refuses a dangling internal link and a capture it could not
      # namespace, so this is a real check rather than a smoke test.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The agent workflows embed a JSON document inside a single-quoted shell
      # word inside a YAML block scalar. YAML validation sees none of the three
      # ways that can break, and the failure only shows up minutes into a run
      # that has already spent tokens -- which is how it was found the first
      # time. Cheap to check here instead.
      - name: Agent workflow schemas
        run: python3 scripts/check-workflow-schemas.py

      - name: Website
        run: |
          pip install --disable-pip-version-check markdown==3.7
          python web/build.py
