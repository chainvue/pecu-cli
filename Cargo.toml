[package]
name = "verus-pecu-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "A hacker-flavoured Verus CLI wallet — the example app for the Verus Rust SDK"
publish = false

[[bin]]
name = "pecu"
path = "src/main.rs"

# Mirrors of the SDK's own feature flags, so `pecu doctor` can report what this
# binary was actually built with instead of trusting a hardcoded list. `network`
# is not optional here: an offline-only build of this CLI would have almost no
# commands.
[features]
default = []
light = ["verus-sdk/light"]
prover = ["verus-sdk/prover"]
shielded = ["verus-sdk/shielded"]

[dependencies]
# The SDK this whole program exists to demonstrate. Pinned by rev: the crate is
# in early development and is not on crates.io, so "latest main" is not a
# reproducible dependency.
verus-sdk = { git = "https://github.com/chainvue/verus-rust-sdk", rev = "ae08bc0c806747c088104c003feee9b01171dd05", features = [
    "network",
] }

anstream = "0.6"
anstyle = "1.0"
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.5"
getrandom = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
miette = { version = "7", features = ["fancy"] }
qrcode = { version = "0.14", default-features = false }
rqrr = "0.9"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
thiserror = "2"
toml = "0.8"
unicode-width = "0.2"
zeroize = "1"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
